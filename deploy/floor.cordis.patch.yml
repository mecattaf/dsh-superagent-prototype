# ~/.dsh/profiles/floor/cordis.patch.yml   (canonical: fork deploy/)
- id: dsh-superagent
  config:
    stateDir: /home/tom/.agency/state/master
    # Floor mode (DESIGN 7): spool intake, DshdExecutor, no GitHub or Feishu setup. Empty agencies = master at ~.
    scheduled: { enabled: true }
- id: agent-default-model
  config: { provider: claude, model: opus, reasoningEffort: medium }
- id: llm-claude
  config:
    executablePath: "/home/tom/.dsh/profiles/floor/node_modules/\
      dsh-superagent/bin/floor-claude"
    idleTimeoutMs: 1800000
    maxProcesses: 2
# The panel and the tunnel need a fixed port; the same-origin guard
# checks Host 127.0.0.1:3082 (surface b.8.3). A patch's config replaces
# the composed block whole, so host and compression are restated: with
# `{ port: 3082 }` alone the webserver refuses `$.host missing` and the
# floor does not start (strix rehearsal, 12 Nov 03:16Z).
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
# One scheduler only: DSH's own Schedule stays off (Agency Web
# precedent, dsh-claude-web.patch.yml).
- id: schedule
  disabled: true
- id: ui-schedule
  disabled: true
# The floor has no GitHub or Feishu Source (DESIGN 10.3); the bundle inserts both watch plugins.
- id: dsh-superagent-github
  disabled: true
- id: dsh-superagent-feishu
  disabled: true
